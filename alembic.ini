# Configuração do Alembic (migrações do esquema do banco).
# Não rode "alembic upgrade" direto: use "python -m app.migrar", que faz backup antes (ver README).
# A URL do banco NÃO fica aqui: vem de app/config.py (variável DATABASE_URL ou .env).

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
# Separa caminhos pelo separador do sistema (";" no Windows), e não por ":" (que aparece em "C:\").
path_separator = os
# Arquivos nomeados "0001_baseline.py", "0002_...": a ordem fica visível na pasta.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
