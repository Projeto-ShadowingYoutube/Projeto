<!DOCTYPE html>
<html lang="pt-br">
    <head>
         <meta charset="UTF-8">
        <link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">

        <link rel="stylesheet" href="/static/css/style.css">
        
        <script src="https://www.youtube.com/iframe_api"></script>
        <script src="/static/js/blur.js" defer></script>
        <script src="/static/js/darkmode.js" defer></script>
        <script src="/static/js/player.js" defer></script>
        <script src="/static/js/voice.js" defer></script>
        <script src="/static/js/integracao.js" defer></script>

        <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.js" integrity="sha384-ezjq8118wdwdRMj+nX4bevEi+cDLTbhLAeFF688VK8tPDGeLUe0WoY2MZtSla72F" crossorigin="anonymous"></script>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>projeto</title>
    </head>
    <body>
        <header>
            <h1><a href="/">Shadow</a></h1>
            <button hx-get="/revisao" hx-target="main">pagina 3</button>
            <button id="mode">
                <img id="modeSVG" src="/static/img/lightMode.svg" alt="">
            </button>
        </header>

       <main hx-get="{{pagina}}"
              hx-target="main"
              hx-trigger="load">
        </main>
        <div class="w3-modal w3-animate-opacity" id="erroModal">
            <div class="w3-modal-content" id="erroDiv">
                <p id="erro"></p>
                <button id="botaoErro"
                        hx-get="/"
                        hx-target="main"
                        hx-push-url="true">inicio</button>
            </div>
        </div>
        <script>
            document.body.addEventListener('htmx:afterSettle', function(evt) {
                if (document.getElementById('player')) {
                    const parametrosDaURL = new URLSearchParams(window.location.search);
                    const link = parametrosDaURL.get('link');
                    
                    if (link) {
                        iniciarSessao(link);
                    }
                    
                    // Reatribui o evento de clique ao botão de gravar que acabou de ser injetado
                    const micBtn = document.getElementById("gravar");
                    if(micBtn) micBtn.addEventListener("click", startRecording);
                }
            });
        </script>
    </body>
</html>
