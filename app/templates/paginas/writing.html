<!-- Writing Challenge (Membro 3): o JavaScript está em static/js/paginas/writing.js, que alterna as três telas.
     Só estrutura fixa aqui: tudo o que vem do servidor (tema, texto, nomes) entra pelo JS com textContent. -->
<div class="pagina writing" data-pagina="writing">

    <section class="writing-tela animate-fade-in" data-tela="inicio">
        <header class="writing-cabecalho">
            <h2 class="writing-titulo">Writing Challenge</h2>
            <span class="writing-cota" data-cota></span>
        </header>
        <div data-aviso-ia></div>
        <p class="writing-instrucao">Escolha uma categoria. O tema é sorteado dentro dela.</p>
        <div class="writing-categorias" data-categorias></div>
        <h3 class="writing-subtitulo">Redações recentes</h3>
        <div class="writing-recentes" data-recentes></div>
    </section>

    <section class="writing-tela animate-fade-in" data-tela="editor" hidden>
        <header class="writing-cabecalho">
            <div>
                <span class="writing-categoria" data-categoria></span>
                <span class="writing-detalhe" data-detalhe></span>
            </div>
            <span class="writing-timer" data-timer role="timer" title="Tempo restante"></span>
        </header>
        <p class="writing-enunciado" data-enunciado></p>
        <textarea class="writing-texto" data-texto maxlength="10000" spellcheck="false" autocomplete="off"
                  aria-label="Sua redação" placeholder="Write your essay here..."></textarea>
        <div class="writing-rodape">
            <span class="writing-contador" data-contador></span>
            <span class="writing-salvo" data-salvo aria-live="polite"></span>
        </div>
        <div data-aviso-ia-envio></div>
        <div class="writing-acoes">
            <button type="button" class="writing-botao" data-sair>Salvar e voltar</button>
            <span class="writing-dica" data-dica></span>
            <button type="button" class="writing-botao principal" data-enviar disabled>Enviar redação</button>
        </div>
    </section>

    <section class="writing-tela animate-fade-in" data-tela="fim" hidden>
        <h2 class="writing-titulo" data-fim-titulo></h2>
        <p class="writing-fim-texto" data-fim-texto></p>
        <p class="writing-fim-aviso" data-fim-aviso></p>
        <div class="writing-acoes">
            <button type="button" class="writing-botao" data-voltar>Voltar ao início</button>
            <button type="button" class="writing-botao principal" data-avaliar hidden>Avaliar de novo</button>
        </div>
    </section>

    <section class="writing-tela animate-fade-in" data-tela="resultado" hidden>
        <header class="writing-cabecalho">
            <div>
                <span class="writing-categoria" data-res-categoria></span>
                <span class="writing-detalhe" data-res-info></span>
            </div>
            <div class="writing-nota-geral" title="Média das cinco categorias">
                <span>Nota geral</span>
                <strong data-res-nota></strong>
                <span>/ 10</span>
            </div>
        </header>
        <p class="writing-enunciado" data-res-enunciado></p>
        <div class="writing-resultado">
            <div class="writing-resultado-texto">
                <h3 class="writing-subtitulo">Sua redação</h3>
                <div class="writing-redacao" data-res-texto></div>
                <div class="writing-legenda" data-res-legenda></div>
                <div class="writing-trecho-detalhe" data-res-trecho aria-live="polite"></div>
            </div>
            <aside class="writing-resultado-notas">
                <div class="writing-notas" data-res-notas></div>
                <h3 class="writing-subtitulo">Resumo</h3>
                <p class="writing-resumo" data-res-resumo></p>
            </aside>
        </div>
        <div class="writing-acoes">
            <button type="button" class="writing-botao" data-res-voltar>Voltar ao início</button>
        </div>
    </section>
</div>
