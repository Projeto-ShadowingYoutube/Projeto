<!-- Tela de cadastro: o JavaScript dela está em static/js/paginas/auth.js. -->
<div class="pagina pagina-auth" data-pagina="cadastro" data-proximo="{{ proximo }}">
    <h1 class="hero-title">SHADOWING</h1>
    <p class="hero-sub">Crie sua conta: seus Decks e Cards ficam só com você.</p>

    <!-- method="post": mesmo se enviado antes do JS (ou sem JS), a senha nunca vai na URL (histórico, logs).
         O botão só é habilitado quando auth.js assume o envio. -->
    <form class="input-card auth-form" method="post">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" class="url-input" autocomplete="email" maxlength="254" required>

        <label for="senha">Senha (mínimo de 8 caracteres)</label>
        <input type="password" id="senha" name="senha" class="url-input" autocomplete="new-password" minlength="8" maxlength="128" required>

        <label for="confirmacao">Confirme a senha</label>
        <input type="password" id="confirmacao" name="confirmacao" class="url-input" autocomplete="new-password" minlength="8" maxlength="128" required>

        <p class="auth-erro" role="alert" hidden></p>

        <div class="btn-row">
            <button type="submit" class="main-btn btn-practice" disabled>CRIAR CONTA</button>
        </div>

        <p class="auth-alternativa">
            Já tem conta?
            <a href="/login{% if proximo != '/' %}?proximo={{ proximo | urlencode }}{% endif %}">Entrar</a>
        </p>
    </form>
</div>
