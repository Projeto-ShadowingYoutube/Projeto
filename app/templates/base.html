<!DOCTYPE html>
<html lang="pt-br" data-theme="dark">
    <head>
        <meta charset="UTF-8">
        <title>Shadowing - Beta</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!-- Sem cache de histórico: ao usar o "voltar" do navegador, a página é recarregada do servidor. -->
        <meta name="htmx-config" content='{"historyCacheSize": 0, "refreshOnHistoryMiss": true}'>

        <link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
        <!-- Estilos por assunto; a ordem importa (regras de componentes vêm depois das gerais). -->
        <link rel="stylesheet" href="/static/css/base.css">
        <link rel="stylesheet" href="/static/css/inicio.css">
        <link rel="stylesheet" href="/static/css/player.css">
        <link rel="stylesheet" href="/static/css/painel.css">
        <link rel="stylesheet" href="/static/css/legenda.css">
        <link rel="stylesheet" href="/static/css/modais.css">
        <link rel="stylesheet" href="/static/css/decks.css">
        <link rel="stylesheet" href="/static/css/auth.css">

        <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js" crossorigin="anonymous"></script>
        <script src="https://unpkg.com/wavesurfer.js@8.0.4/dist/wavesurfer.min.js"></script>

        <!-- Front-end em ES modules: main.js importa o resto (static/js/nucleo, componentes e paginas). -->
        <script type="module" src="/static/js/main.js"></script>
    </head>
    <body>
        <div class="thumbnails-bg">
            <img src="/static/img/t1.jpg" class="thumb t1" alt="">
            <img src="/static/img/t2.jpg" class="thumb t2" alt="">
            <img src="/static/img/t3.jpg" class="thumb t3" alt="">
            <img src="/static/img/t5.jpg" class="thumb t4" alt="">
            <img src="/static/img/t4.jpg" class="thumb t5" alt="">
            <img src="/static/img/t6.jpg" class="thumb t6" alt="">
            <img src="/static/img/t7.jpg" class="thumb t7" alt="">
            <img src="/static/img/t8.jpg" class="thumb t8" alt="">
        </div>

        <div class="waves-wrapper">
            <svg viewBox="0 0 1000 200" preserveAspectRatio="none" class="wave-svg">
                <path class="path path-1" d="M0,100 C200,0 300,200 500,100 C700,0 800,200 1000,100 C1200,0 1300,200 1500,100 C1700,0 1800,200 2000,100" />
                <path class="path path-2" d="M0,120 C150,250 350,-50 500,120 C650,250 850,-50 1000,120 C1150,250 1350,-50 1500,120 C1650,250 1850,-50 2000,120" />
                <path class="path path-3" d="M0,80 C250,30 250,130 500,80 C750,30 750,130 1000,80 C1250,30 1250,130 1500,80 C1750,30 1750,130 2000,80" />
                <path class="path path-4" d="M0,110 C100,10 400,210 500,110 C600,10 900,210 1000,110 C1100,10 1400,210 1500,110 C1600,10 1900,210 2000,110" />
            </svg>
        </div>

        <header class="navbar">
            <div class="logo"><a href="/" style="color: inherit;">Shadowing</a></div>
            <div class="nav-right">
                {% if usuario %}
                <button class="nav-btn">🔗 <span class="btn-text-mobile">Token</span> <span id="token-count">–</span></button>
                <button class="nav-btn" hx-get="/decks" hx-target="main" hx-push-url="true">↺ <span class="btn-text-mobile">Revisar</span></button>
                <span class="nav-usuario" title="Conta conectada">{{ usuario.email }}</span>
                <button class="nav-btn" id="sair" title="Sair da conta">Sair</button>
                {% endif %}
                <button class="nav-btn theme-toggle" id="mode">☀️</button>
            </div>
        </header>

        <main class="content" hx-get="{{ pagina }}" hx-target="main" hx-trigger="load"></main>

        <div class="w3-modal w3-animate-opacity" id="erroModal">
            <div class="w3-modal-content" id="erroDiv">
                <span class="w3-button w3-display-topright" id="fecharErro">&times;</span>
                <p id="erro"></p>
                <button id="botaoErro" hx-get="/inicio" hx-target="main" hx-push-url="/">início</button>
            </div>
        </div>
    </body>
</html>
